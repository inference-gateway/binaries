name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.binary }} ${{ matrix.platform.os }}-${{ matrix.platform.arch }}
    strategy:
      fail-fast: false
      matrix:
        binary: [whisper-cli, ffmpeg, llama-tts]
        platform:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: ubuntu-24.04, os: windows, arch: amd64 }
          - { runner: macos-26, os: darwin, arch: arm64 }
          - { runner: macos-26, os: darwin, arch: amd64 }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Nix
        if: matrix.platform.os == 'linux'
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build Linux ${{ matrix.binary }} (Nix)
        if: matrix.platform.os == 'linux'
        run: |
          set -euo pipefail
          case "${{ matrix.binary }}" in
            ffmpeg) OUT=$(nix build --impure --no-link --print-out-paths -f static.nix ffmpeg | grep -e '-bin$') ;;
            *)      OUT=$(nix build --impure --no-link --print-out-paths -f static.nix "${{ matrix.binary }}") ;;
          esac
          install -m755 "$OUT/bin/${{ matrix.binary }}" "${{ matrix.binary }}-linux-${{ matrix.platform.arch }}"

      - name: Build Windows whisper-cli (llvm-mingw from source)
        if: matrix.platform.os == 'windows' && matrix.binary == 'whisper-cli'
        run: |
          set -euo pipefail
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" | tar -xJ
          export PATH="$PWD/${LLVM_MINGW}/bin:$PATH"

          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cat > mingw-w64.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_C_COMPILER   x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER  x86_64-w64-mingw32-windres)
          add_compile_definitions(_WIN32_WINNT=0x0A00)
          EOF
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/mingw-w64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build whisper.cpp/build -j --config Release --target whisper-cli
          install -m755 whisper.cpp/build/bin/whisper-cli.exe "whisper-cli-windows-${{ matrix.platform.arch }}.exe"

      - name: Build Windows llama-tts (llvm-mingw from source)
        if: matrix.platform.os == 'windows' && matrix.binary == 'llama-tts'
        run: |
          set -euo pipefail
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" | tar -xJ
          export PATH="$PWD/${LLVM_MINGW}/bin:$PATH"

          cat > mingw-w64.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_C_COMPILER   x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER  x86_64-w64-mingw32-windres)
          add_compile_definitions(_WIN32_WINNT=0x0A00)
          EOF

          git clone --depth 1 --branch b10621 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/mingw-w64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build llama.cpp/build -j --config Release --target llama-tts
          install -m755 llama.cpp/build/bin/llama-tts.exe "llama-tts-windows-${{ matrix.platform.arch }}.exe"

      - name: Build Windows ffmpeg (mingw-w64 from source)
        if: matrix.platform.os == 'windows' && matrix.binary == 'ffmpeg'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nasm make git
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          ( cd ffmpeg-src && ./configure \
              --arch=x86_64 --target-os=mingw32 --cross-prefix=x86_64-w64-mingw32- \
              --disable-shared --enable-static \
              --disable-doc --disable-debug --disable-network --disable-autodetect \
              --disable-everything \
              --enable-demuxer=wav,w64,ogg,matroska,mov,mp3,flac,aac,aiff \
              --enable-muxer=wav,w64 \
              --enable-decoder=pcm_s16le,pcm_s16be,pcm_f32le,pcm_u8,opus,vorbis,mp3,aac,flac,alac \
              --enable-encoder=pcm_s16le \
              --enable-parser=opus,vorbis,aac,flac,mpegaudio \
              --enable-protocol=file,pipe \
              --enable-filter=aresample,aformat,anull,atrim \
              --enable-swresample \
            && make -j"$(nproc)" )
          install -m755 ffmpeg-src/ffmpeg.exe "ffmpeg-windows-${{ matrix.platform.arch }}.exe"

      - name: Set up macOS build tools
        if: matrix.platform.os == 'darwin'
        run: |
          set -euo pipefail
          brew install cmake nasm
          case "${{ matrix.platform.arch }}" in
            amd64) echo "OSX_ARCH=x86_64" >> "$GITHUB_ENV" ;;
            arm64) echo "OSX_ARCH=arm64" >> "$GITHUB_ENV" ;;
          esac

      - name: Build macOS whisper-cli (static from source)
        if: matrix.platform.os == 'darwin' && matrix.binary == 'whisper-cli'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF \
            -DGGML_ACCELERATE=ON
          cmake --build whisper.cpp/build -j --config Release --target whisper-cli
          install -m755 whisper.cpp/build/bin/whisper-cli "whisper-cli-darwin-${{ matrix.platform.arch }}"
          codesign -f -s - "whisper-cli-darwin-${{ matrix.platform.arch }}"

      - name: Build macOS ffmpeg (static from source)
        if: matrix.platform.os == 'darwin' && matrix.binary == 'ffmpeg'
        run: |
          set -euo pipefail
          ffmpeg_cross=()
          if [ "$OSX_ARCH" != "$(uname -m)" ]; then
            ffmpeg_cross=(--enable-cross-compile --arch="$OSX_ARCH"
              --extra-cflags="-arch $OSX_ARCH" --extra-ldflags="-arch $OSX_ARCH")
          fi
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          ( cd ffmpeg-src && ./configure \
              --cc=clang ${ffmpeg_cross[@]+"${ffmpeg_cross[@]}"} \
              --disable-shared --enable-static \
              --disable-doc --disable-debug --disable-network --disable-autodetect \
              --disable-everything \
              --enable-demuxer=wav,w64,ogg,matroska,mov,mp3,flac,aac,aiff \
              --enable-muxer=wav,w64 \
              --enable-decoder=pcm_s16le,pcm_s16be,pcm_f32le,pcm_u8,opus,vorbis,mp3,aac,flac,alac \
              --enable-encoder=pcm_s16le \
              --enable-parser=opus,vorbis,aac,flac,mpegaudio \
              --enable-protocol=file,pipe \
              --enable-filter=aresample,aformat,anull,atrim \
              --enable-swresample \
            && make -j"$(sysctl -n hw.ncpu)" )
          install -m755 ffmpeg-src/ffmpeg "ffmpeg-darwin-${{ matrix.platform.arch }}"
          codesign -f -s - "ffmpeg-darwin-${{ matrix.platform.arch }}"

      - name: Build macOS llama-tts (static from source)
        if: matrix.platform.os == 'darwin' && matrix.binary == 'llama-tts'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b10621 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF \
            -DGGML_ACCELERATE=ON
          cmake --build llama.cpp/build -j --config Release --target llama-tts
          install -m755 llama.cpp/build/bin/llama-tts "llama-tts-darwin-${{ matrix.platform.arch }}"
          codesign -f -s - "llama-tts-darwin-${{ matrix.platform.arch }}"

      - name: Sanity-check binary
        run: |
          set -euo pipefail
          BIN="${{ matrix.binary }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}"
          case "${{ matrix.binary }}" in
            ffmpeg) RUN_FLAG=-version ;;
            *)      RUN_FLAG=--help ;;
          esac
          if [ "${{ matrix.platform.os }}" = linux ]; then
            file "$BIN" | grep -q 'statically linked'
            "./$BIN" "$RUN_FLAG" > /dev/null
          elif [ "${{ matrix.platform.os }}" = darwin ]; then
            case "${{ matrix.platform.arch }}" in amd64) want=x86_64 ;; arm64) want=arm64 ;; esac
            file "$BIN" | grep -q "Mach-O.*$want"
            if otool -L "$BIN" | tail -n +2 | grep -vqE '^\s+(/usr/lib/|/System/Library/)'; then
              echo "::error::$BIN links a non-system library (not self-contained):"
              otool -L "$BIN"
              exit 1
            fi
            if [ "$want" = "$(uname -m)" ]; then
              "./$BIN" "$RUN_FLAG" > /dev/null
            else
              echo "cross-built $want on $(uname -m) host; skipping execution check"
            fi
          elif [ "${{ matrix.platform.os }}" = windows ]; then
            file "$BIN.exe" | grep -qE '(PE32|PE32\+)'
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binaries-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ matrix.binary }}
          path: ${{ matrix.binary }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}*
          if-no-files-found: error
          retention-days: 1
