name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.published }}
      new_release_version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3.2.0
        id: app_token
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'

      - name: Install semantic-release dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-release"
          cat > "$RUNNER_TEMP/semantic-release/package.json" <<'EOF'
          {
            "private": true,
            "devDependencies": {
              "semantic-release": "25.0.5",
              "@semantic-release/commit-analyzer": "13.0.1",
              "@semantic-release/release-notes-generator": "14.1.1",
              "@semantic-release/exec": "7.1.0",
              "@semantic-release/github": "12.0.9",
              "conventional-changelog-conventionalcommits": "10.2.0"
            }
          }
          EOF
          npm install --prefix "$RUNNER_TEMP/semantic-release"
          echo "$RUNNER_TEMP/semantic-release/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Compute next version (dry-run)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          semantic-release --dry-run

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: ubuntu-24.04
            os: windows
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Nix
        if: matrix.os == 'linux'
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build Linux whisper-cli (Nix)
        if: matrix.os == 'linux'
        run: |
          WHISPER=$(nix build --impure --no-link --print-out-paths -f static.nix whisper-cli)
          install -m755 "$WHISPER/bin/whisper-cli" "whisper-cli-linux-${{ matrix.arch }}"

      - name: Build Linux ffmpeg (Nix)
        if: matrix.os == 'linux'
        run: |
          FFMPEG=$(nix build --impure --no-link --print-out-paths -f static.nix ffmpeg | grep -e '-bin$')
          install -m755 "$FFMPEG/bin/ffmpeg" "ffmpeg-linux-${{ matrix.arch }}"

      - name: Build Linux llama-tts (Nix)
        if: matrix.os == 'linux'
        run: |
          LLAMA_TTS=$(nix build --impure --no-link --print-out-paths -f static.nix llama-tts)
          install -m755 "$LLAMA_TTS/bin/llama-tts" "llama-tts-linux-${{ matrix.arch }}"

      - name: Build Windows whisper-cli (llvm-mingw from source)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" | tar -xJ
          export PATH="$PWD/${LLVM_MINGW}/bin:$PATH"

          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cat > mingw-w64.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_C_COMPILER   x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER  x86_64-w64-mingw32-windres)
          add_compile_definitions(_WIN32_WINNT=0x0602)
          EOF
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/mingw-w64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build whisper.cpp/build -j --config Release --target whisper-cli
          install -m755 whisper.cpp/build/bin/whisper-cli.exe "whisper-cli-windows-${{ matrix.arch }}.exe"

      - name: Build Windows llama-tts (llvm-mingw from source)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          if [ ! -d "$LLVM_MINGW" ]; then
            curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" | tar -xJ
          fi
          export PATH="$PWD/${LLVM_MINGW}/bin:$PATH"

          # Same tag as static.nix and the macOS step, same toolchain file as
          # the whisper-cli step above.
          git clone --depth 1 --branch b10621 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/mingw-w64.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build llama.cpp/build -j --config Release --target llama-tts
          install -m755 llama.cpp/build/bin/llama-tts.exe "llama-tts-windows-${{ matrix.arch }}.exe"

      - name: Build Windows ffmpeg (mingw-w64 from source)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nasm make git
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          ( cd ffmpeg-src && ./configure \
              --arch=x86_64 --target-os=mingw32 --cross-prefix=x86_64-w64-mingw32- \
              --disable-shared --enable-static \
              --disable-doc --disable-debug --disable-network --disable-autodetect \
              --disable-everything \
              --enable-demuxer=wav,w64,ogg,matroska,mov,mp3,flac,aac,aiff \
              --enable-muxer=wav,w64 \
              --enable-decoder=pcm_s16le,pcm_s16be,pcm_f32le,pcm_u8,opus,vorbis,mp3,aac,flac,alac \
              --enable-encoder=pcm_s16le \
              --enable-parser=opus,vorbis,aac,flac,mpegaudio \
              --enable-protocol=file,pipe \
              --enable-filter=aresample,aformat,anull,atrim \
              --enable-swresample \
            && make -j"$(nproc)" )
          install -m755 ffmpeg-src/ffmpeg.exe "ffmpeg-windows-${{ matrix.arch }}.exe"

      - name: Set up macOS build tools
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          brew install cmake nasm
          case "${{ matrix.arch }}" in
            amd64) echo "OSX_ARCH=x86_64" >> "$GITHUB_ENV" ;;
            arm64) echo "OSX_ARCH=arm64" >> "$GITHUB_ENV" ;;
          esac

      - name: Build macOS whisper-cli (static from source)
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF \
            -DGGML_ACCELERATE=ON
          cmake --build whisper.cpp/build -j --config Release --target whisper-cli
          install -m755 whisper.cpp/build/bin/whisper-cli "whisper-cli-darwin-${{ matrix.arch }}"
          codesign -f -s - "whisper-cli-darwin-${{ matrix.arch }}"

      - name: Build macOS ffmpeg (static from source)
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          ffmpeg_cross=()
          if [ "$OSX_ARCH" != "$(uname -m)" ]; then
            ffmpeg_cross=(--enable-cross-compile --arch="$OSX_ARCH"
              --extra-cflags="-arch $OSX_ARCH" --extra-ldflags="-arch $OSX_ARCH")
          fi
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg ffmpeg-src
          ( cd ffmpeg-src && ./configure \
              --cc=clang ${ffmpeg_cross[@]+"${ffmpeg_cross[@]}"} \
              --disable-shared --enable-static \
              --disable-doc --disable-debug --disable-network --disable-autodetect \
              --disable-everything \
              --enable-demuxer=wav,w64,ogg,matroska,mov,mp3,flac,aac,aiff \
              --enable-muxer=wav,w64 \
              --enable-decoder=pcm_s16le,pcm_s16be,pcm_f32le,pcm_u8,opus,vorbis,mp3,aac,flac,alac \
              --enable-encoder=pcm_s16le \
              --enable-parser=opus,vorbis,aac,flac,mpegaudio \
              --enable-protocol=file,pipe \
              --enable-filter=aresample,aformat,anull,atrim \
              --enable-swresample \
            && make -j"$(sysctl -n hw.ncpu)" )
          install -m755 ffmpeg-src/ffmpeg "ffmpeg-darwin-${{ matrix.arch }}"
          codesign -f -s - "ffmpeg-darwin-${{ matrix.arch }}"

      - name: Build macOS llama-tts (static from source)
        if: matrix.os == 'darwin'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b10621 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF \
            -DGGML_ACCELERATE=ON
          cmake --build llama.cpp/build -j --config Release --target llama-tts
          install -m755 llama.cpp/build/bin/llama-tts "llama-tts-darwin-${{ matrix.arch }}"
          codesign -f -s - "llama-tts-darwin-${{ matrix.arch }}"

      - name: Sanity-check binaries
        run: |
          if [ "${{ matrix.os }}" = linux ]; then
            for bin in whisper-cli ffmpeg llama-tts; do
              file "$bin-linux-${{ matrix.arch }}" | grep -q 'statically linked'
            done
            "./ffmpeg-linux-${{ matrix.arch }}" -version
            "./whisper-cli-linux-${{ matrix.arch }}" --help > /dev/null
            "./llama-tts-linux-${{ matrix.arch }}" --help > /dev/null
          elif [ "${{ matrix.os }}" = darwin ]; then
            case "${{ matrix.arch }}" in amd64) want=x86_64 ;; arm64) want=arm64 ;; esac
            for bin in "whisper-cli-darwin-${{ matrix.arch }}" "ffmpeg-darwin-${{ matrix.arch }}" "llama-tts-darwin-${{ matrix.arch }}"; do
              file "$bin" | grep -q "Mach-O.*$want"
              if otool -L "$bin" | tail -n +2 | grep -vqE '^\s+(/usr/lib/|/System/Library/)'; then
                echo "::error::$bin links a non-system library (not self-contained):"
                otool -L "$bin"
                exit 1
              fi
            done
            if [ "$want" = "$(uname -m)" ]; then
              "./ffmpeg-darwin-${{ matrix.arch }}" -version
              "./whisper-cli-darwin-${{ matrix.arch }}" --help > /dev/null
              "./llama-tts-darwin-${{ matrix.arch }}" --help > /dev/null
            else
              echo "cross-built $want on $(uname -m) host; skipping execution check"
            fi
          elif [ "${{ matrix.os }}" = windows ]; then
            file "whisper-cli-windows-${{ matrix.arch }}.exe" | grep -qE '(PE32|PE32\+)'
            file "ffmpeg-windows-${{ matrix.arch }}.exe" | grep -qE '(PE32|PE32\+)'
            file "llama-tts-windows-${{ matrix.arch }}.exe" | grep -qE '(PE32|PE32\+)'
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            whisper-cli-*
            ffmpeg-*
            llama-tts-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs:
      - version
      - build
    if: needs.version.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3.2.0
        id: app_token
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'

      - name: Install semantic-release dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-release"
          cat > "$RUNNER_TEMP/semantic-release/package.json" <<'EOF'
          {
            "private": true,
            "devDependencies": {
              "semantic-release": "25.0.5",
              "@semantic-release/commit-analyzer": "13.0.1",
              "@semantic-release/release-notes-generator": "14.1.1",
              "@semantic-release/exec": "7.1.0",
              "@semantic-release/github": "12.0.9",
              "conventional-changelog-conventionalcommits": "10.2.0"
            }
          }
          EOF
          npm install --prefix "$RUNNER_TEMP/semantic-release"
          echo "$RUNNER_TEMP/semantic-release/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release artifacts
        run: |
          cd dist
          chmod +x whisper-cli-* ffmpeg-* llama-tts-*
          # checksum everything but the checksum file itself
          sha256sum whisper-cli-* ffmpeg-* llama-tts-* | grep -v checksums.txt > checksums.txt

      - name: Verify all assets present
        run: |
          cd dist
          missing=0
          for f in \
            whisper-cli-linux-amd64 \
            whisper-cli-linux-arm64 \
            whisper-cli-darwin-amd64 \
            whisper-cli-darwin-arm64 \
            whisper-cli-windows-amd64.exe \
            ffmpeg-linux-amd64 \
            ffmpeg-linux-arm64 \
            ffmpeg-darwin-amd64 \
            ffmpeg-darwin-arm64 \
            ffmpeg-windows-amd64.exe \
            llama-tts-linux-amd64 \
            llama-tts-linux-arm64 \
            llama-tts-darwin-amd64 \
            llama-tts-darwin-arm64 \
            llama-tts-windows-amd64.exe \
            checksums.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "refusing to publish an incomplete immutable release"
            exit 1
          fi
          ls -la

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          semantic-release
